id = "pbolkhovitin/yandex-music"
name = "Yandex Music (P0 stub)"
version = "0.0.1"
plugin_api = 35
author = "pbolkhovitin"
license = "MIT"
icon = "music"
description = "P0 stub: bar widget, SSE bridge, panel and API probe for the ymd daemon."
tags = ["music", "yandex", "p0"]

# Бар-виджет: состояние + play/pause.
[[widget]]
id = "bar"
entry = "widget.luau"
hover_highlight = false

# Диагностический виджет: печатает реальные имена методов barWidget.*/ui.*/noctalia.*
[[widget]]
id = "probe"
entry = "probe.luau"

# Фоновая подписка на SSE (проверка noctalia.httpStream).
[[service]]
id = "bridge"
entry = "bridge.luau"

# Панель: проверка декларативного ui.* дерева.
[[panel]]
id = "panel"
entry = "panel.luau"
